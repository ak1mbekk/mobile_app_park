appId: by.animalpark.mapmodule
productName: MapModule
asar: true

directories:
  output: release

files:
  - dist/**
  - electron/**
  - package.json
  - node_modules/**/*

mac:
  target: dmg
  category: public.app-category.utilities
  identity: null

win:
  target: nsis

linux:
  target: AppImage

artifactName: '${productName}-${version}-${os}-${arch}.${ext}'

nsis:
  oneClick: true
  perMachine: false
