<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<title>Карта парка</title>
<script>
  const boundary = new URLSearchParams(location.hash.slice(1)).get('boundary');
  const place = boundary && /^([12])\/([a-zA-Z0-9_.-]+)$/.exec(boundary);
  location.replace('map.html#map/' + (place ? place[1] + '/' + place[2] : '1'));
</script>
<a href="map.html#map/1">Открыть карту парка</a>
</html>
